; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = freenove-esp32-s3

[common]
build_flags = -std=gnu++17 -Wall -Wextra
monitor_speed = 115200

[env:freenove-esp32-s3]
platform = espressif32 @ 8.0.0
board = freenove_esp32_s3_wroom_n16r8
framework = arduino
build_unflags = -DARDUINO_USB_MODE=0 -DARDUINO_USB_CDC_ON_BOOT=0 -std=gnu++11
build_flags = ${common.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -DELEGANTOTA_USE_ASYNC_WEBSERVER=1 -DNETWIZARD_USE_ASYNC_WEBSERVER=1
monitor_speed = ${common.monitor_speed}
board_build.partitions = partitions/scapesense_16mb.csv
board_build.filesystem = littlefs
lib_compat_mode = strict
lib_deps =
    olikraus/U8g2 @ ^2.35.19
    esp32async/AsyncTCP @ 3.5.0
    esp32async/ESPAsyncWebServer @ 3.12.1
    bblanchon/ArduinoJson @ ^7.4.2
    ayushsharma82/NetWizard @ 2.0.0
    ayushsharma82/WebSerial @ 2.1.2
    ayushsharma82/ElegantOTA @ 4.0.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    bogde/HX711 @ 0.7.5

[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
test_filter = test_rolling_average, test_sampler, test_bubble_counter, test_bubble_pipeline, test_url_decode, test_portal_page, test_status_json, test_status_page, test_display_wake_controller, test_sensor_tuning, test_daily_stats, test_daily_stats_json, test_oled_type, test_temperature_reading, test_load_cell_reading, test_median_filter, test_weight_format, test_project_config, test_monitoring_settings, test_remote_notifications, test_iot_protocol
build_src_filter = -<**>
